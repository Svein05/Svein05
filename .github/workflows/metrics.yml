name: Generate Metrics

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metrics-steam:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Steam Profile & Games
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: svein05
          template: classic
          base: ""
          filename: assets/svg/github-metrics-steam.svg
          config_timezone: America/Santiago
          config_theme: darkhub

          # Steam Profile and top 1 games only (ignoring Wallpaper Engine 431960)
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: ${{ secrets.STEAM_USER_ID || vars.STEAM_USER_ID || '0' }}
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_ignored: 431960
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
          plugin_steam_achievements_limit: 0
          plugin_steam_playtime_threshold: 0
