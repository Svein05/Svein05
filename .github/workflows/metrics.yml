name: Generate Metrics

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  metrics-github:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub Activity & Stargazers
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: svein05
          template: classic
          base: ""
          filename: github-metrics-activity.svg
          config_timezone: America/Santiago
          config_theme: darkhub

          # Stargazers (Classic Charts)
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic

          # Recent Activity
          plugin_activity: yes
          plugin_activity_limit: 4
          plugin_activity_days: 0
          plugin_activity_load: 300
          plugin_activity_filter: push, issue, pr, release, fork
          plugin_activity_timestamps: yes

  metrics-steam:
    needs: metrics-github
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Steam Profile & Games
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: svein05
          template: classic
          base: ""
          filename: github-metrics-steam.svg
          config_timezone: America/Santiago
          config_theme: darkhub

          # Steam Profile and top 1 games only (ignoring Wallpaper Engine 431960)
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: ${{ secrets.STEAM_USER_ID || vars.STEAM_USER_ID || '0' }}
          plugin_steam_sections: player, most-played, recently-played
          plugin_steam_games_ignored: 431960
          plugin_steam_games_limit: 1
          plugin_steam_recent_games_limit: 1
          plugin_steam_achievements_limit: 0
          plugin_steam_playtime_threshold: 0
